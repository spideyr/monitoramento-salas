<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoramento</title>

<meta name="theme-color" content="#e50914">

<style>
body {
font-family: Arial;
background: #0f0f0f;
color: white;
padding: 8px;
max-width: 380px;
margin: auto;
}

h1 {
text-align: center;
color: #e50914;
font-size: 18px;
margin-bottom: 8px;
}

.container {
background: #1c1c1c;
padding: 8px;
border-radius: 8px;
margin-bottom: 8px;
}

label {
font-size: 12px;
margin-top: 4px;
display: block;
}

select, input, textarea, button {
width: 100%;
margin-top: 4px;
padding: 6px;
border-radius: 5px;
border: none;
font-size: 13px;
}

input, select, textarea {
background: #2b2b2b;
color: white;
}

textarea {
resize: none;
height: 50px;
}

button {
background: #e50914;
color: white;
font-weight: bold;
font-size: 13px;
}

.registro {
background: #1a1a1a;
padding: 8px;
margin-top: 6px;
border-radius: 6px;
border-left: 3px solid #e50914;
font-size: 12px;
}

.topo {
display: flex;
flex-direction: column;
font-size: 11px;
margin-bottom: 4px;
}

.topo strong {
font-size: 13px;
}

.acoes button {
margin-top: 4px;
background: #333;
font-size: 11px;
padding: 5px;
}

.filtro {
margin-bottom: 6px;
font-size: 13px;
padding: 6px;
}
</style>
</head>

<body>

<h1>🎬 Monitoramento</h1>

<div class="container">

<label>Sala</label>
<select id="sala">
<option value=""></option>
<option>Sala 1</option>
<option>Sala 2</option>
<option>Sala 3</option>
<option>Sala 4</option>
</select>

<label>Fileira</label>
<input type="text" id="fileira">

<label>Poltrona</label>
<input type="number" id="poltrona">

<label>Problema</label>
<select id="problema">
<option>Sem Número</option>
<option>Trocar Braço</option>
<option>Poltrona Rasgada</option>
<option>Trocar Poltrona</option>
<option>Trocar Apoio Completo de Braço</option>
</select>

<label>Observações</label>
<textarea id="obs"></textarea>

<button onclick="salvar()">Salvar</button>
<button onclick="limparTudo()">Limpar Tudo</button>

</div>

<input class="filtro" type="text" id="filtro" oninput="mostrar()">

<div id="lista"></div>

<script>
let registros = JSON.parse(localStorage.getItem("cinema")) || [];
let editIndex = null;

function salvar() {
const sala = document.getElementById("sala").value;
const fileira = document.getElementById("fileira").value.toUpperCase();
const poltrona = document.getElementById("poltrona").value;
const problema = document.getElementById("problema").value;
const obs = document.getElementById("obs").value;

if (!sala || !fileira || !poltrona) return alert("Preencha");

const data = new Date().toLocaleString("pt-BR");

const registro = {
sala,
assento: fileira + poltrona,
problema,
obs,
data
};

if (editIndex !== null) {
registros[editIndex] = registro;
editIndex = null;
} else {
registros.push(registro);
}

registros.sort((a, b) => a.sala.localeCompare(b.sala));

localStorage.setItem("cinema", JSON.stringify(registros));

limparCampos();
mostrar();
}

function mostrar() {
const lista = document.getElementById("lista");
const filtro = document.getElementById("filtro").value.toLowerCase();

lista.innerHTML = "";

registros
.filter(r => r.sala.toLowerCase().includes(filtro))
.forEach((r, index) => {

const div = document.createElement("div");
div.className = "registro";

div.innerHTML = `
<div class="topo">
<strong>${r.sala}</strong>
<span>${r.data}</span>
</div>
🎟 ${r.assento}<br>
⚠ ${r.problema}
${r.obs ? `<br>📝 ${r.obs}` : ""}
<div class="acoes">
<button onclick="editar(${index})">Editar</button>
<button onclick="excluir(${index})">Excluir</button>
</div>
`;

lista.appendChild(div);

});
}

function excluir(index) {
if (confirm("Excluir?")) {
registros.splice(index, 1);
localStorage.setItem("cinema", JSON.stringify(registros));
mostrar();
}
}

function editar(index) {
const r = registros[index];

document.getElementById("sala").value = r.sala;
document.getElementById("fileira").value = r.assento.charAt(0);
document.getElementById("poltrona").value = r.assento.slice(1);
document.getElementById("problema").value = r.problema;
document.getElementById("obs").value = r.obs || "";

editIndex = index;
}

function limparCampos() {
document.getElementById("sala").value = "";
document.getElementById("fileira").value = "";
document.getElementById("poltrona").value = "";
document.getElementById("obs").value = "";
}

function limparTudo() {
if (confirm("Apagar tudo?")) {
localStorage.removeItem("cinema");
registros = [];
mostrar();
}
}

mostrar();
</script>

</body>
</html>
